<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }

        .score-box {
            background: #ecf0f1;
            padding: 15px 25px;
            border-radius: 8px;
            color: #333;
        }

        .score-box strong {
            display: block;
            font-size: 1.8em;
            color: #667eea;
            margin-top: 5px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: #c0392b;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .tile {
            width: 80px;
            height: 80px;
            background: #ecf0f1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #333;
            transition: all 0.15s;
        }

        .tile[data-value="2"] { background: #eee4da; color: #776e65; }
        .tile[data-value="4"] { background: #ede0c8; color: #776e65; }
        .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .tile[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .tile[data-value="128"] { background: #edcf72; color: #095f6b; font-size: 1.5em; }
        .tile[data-value="256"] { background: #edcc61; color: #095f6b; font-size: 1.5em; }
        .tile[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.5em; }
        .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 1.3em; }
        .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 1.3em; }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .instructions {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            color: #333;
            text-align: left;
            max-width: 400px;
            margin: 0 auto;
        }

        .instructions p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>2️⃣0️⃣4️⃣8️⃣</h1>
        
        <div class="info">
            <div class="score-box">
                Score
                <strong id="score">0</strong>
            </div>
            <div class="score-box">
                Best
                <strong id="best">0</strong>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="controls">
            <button onclick="newGame()">New Game</button>
        </div>

        <div class="instructions">
            <p><strong>How to Play:</strong></p>
            <p>Use Arrow Keys to move tiles. Combine tiles with the same number to reach 2048!</p>
        </div>
    </div>

    <script>
        const SIZE = 4;
        let board = [];
        let score = 0;
        let best = localStorage.getItem('2048-best') || 0;
        document.getElementById('best').textContent = best;

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    moveUp();
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveDown();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    moveLeft();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveRight();
                    break;
            }
        });

        function newGame() {
            board = Array(SIZE * SIZE).fill(0);
            score = 0;
            document.getElementById('score').textContent = score;
            addNewTile();
            addNewTile();
            render();
        }

        function addNewTile() {
            const empty = board.map((v, i) => v === 0 ? i : -1).filter(i => i !== -1);
            if (empty.length > 0) {
                const index = empty[Math.floor(Math.random() * empty.length)];
                board[index] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function moveLeft() {
            let moved = false;
            for (let i = 0; i < SIZE; i++) {
                const row = getRow(i);
                const newRow = slideAndMerge(row);
                if (!arraysEqual(row, newRow)) moved = true;
                setRow(i, newRow);
            }
            if (moved) {
                addNewTile();
                render();
            }
        }

        function moveRight() {
            let moved = false;
            for (let i = 0; i < SIZE; i++) {
                const row = getRow(i).reverse();
                const newRow = slideAndMerge(row).reverse();
                if (!arraysEqual(getRow(i), newRow)) moved = true;
                setRow(i, newRow);
            }
            if (moved) {
                addNewTile();
                render();
            }
        }

        function moveUp() {
            let moved = false;
            for (let j = 0; j < SIZE; j++) {
                const col = getColumn(j);
                const newCol = slideAndMerge(col);
                if (!arraysEqual(col, newCol)) moved = true;
                setColumn(j, newCol);
            }
            if (moved) {
                addNewTile();
                render();
            }
        }

        function moveDown() {
            let moved = false;
            for (let j = 0; j < SIZE; j++) {
                const col = getColumn(j).reverse();
                const newCol = slideAndMerge(col).reverse();
                if (!arraysEqual(getColumn(j), newCol)) moved = true;
                setColumn(j, newCol);
            }
            if (moved) {
                addNewTile();
                render();
            }
        }

        function slideAndMerge(arr) {
            arr = arr.filter(v => v !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                    i++;
                }
            }
            while (arr.length < SIZE) arr.push(0);
            return arr;
        }

        function getRow(i) {
            return board.slice(i * SIZE, (i + 1) * SIZE);
        }

        function setRow(i, row) {
            for (let j = 0; j < SIZE; j++) {
                board[i * SIZE + j] = row[j];
            }
        }

        function getColumn(j) {
            const col = [];
            for (let i = 0; i < SIZE; i++) {
                col.push(board[i * SIZE + j]);
            }
            return col;
        }

        function setColumn(j, col) {
            for (let i = 0; i < SIZE; i++) {
                board[i * SIZE + j] = col[i];
            }
        }

        function arraysEqual(a, b) {
            return JSON.stringify(a) === JSON.stringify(b);
        }

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach(value => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = value || '';
                tile.setAttribute('data-value', value);
                boardEl.appendChild(tile);
            });
            document.getElementById('score').textContent = score;
            if (score > best) {
                best = score;
                localStorage.setItem('2048-best', best);
                document.getElementById('best').textContent = best;
            }
        }

        newGame();
    </script>
</body>
</html>
