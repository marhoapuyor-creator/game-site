<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 20px;
        }

        .score-box {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            color: #333;
            font-size: 1.2em;
        }

        .score-box strong {
            display: block;
            font-size: 1.8em;
            color: #667eea;
            margin-top: 5px;
        }

        #gameCanvas {
            border: 5px solid white;
            background: #1a1a1a;
            display: block;
            margin: 0 auto 20px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .instructions {
            background: white;
            padding: 15px;
            border-radius: 8px;
            color: #333;
            margin-top: 20px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧱 Breakout</h1>
        
        <div class="info">
            <div class="score-box">
                Score
                <strong id="score">0</strong>
            </div>
            <div class="score-box">
                Level
                <strong id="level">1</strong>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="controls">
            <button onclick="startGame()">Start Game</button>
            <button onclick="resetGame()">Reset</button>
        </div>

        <div class="instructions">
            <strong>How to Play:</strong><br>
            Move your paddle left and right with Arrow Keys. Break all the bricks with the ball!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddle = {
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            width: 80,
            height: 15,
            dx: 0
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 8,
            dx: 4,
            dy: -4,
            speed: 4
        };

        let bricks = [];
        let score = 0;
        let level = 1;
        let gameActive = false;
        let gameOver = false;

        const brickConfig = {
            rows: 4,
            cols: 8,
            width: 80,
            height: 20,
            padding: 10,
            offsetX: 20,
            offsetY: 30
        };

        // Event listeners
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);

        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft') paddle.dx = -7;
            if (e.key === 'ArrowRight') paddle.dx = 7;
        }

        function handleKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') paddle.dx = 0;
        }

        function initBricks() {
            bricks = [];
            const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71'];
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    bricks.push({
                        x: brickConfig.offsetX + c * (brickConfig.width + brickConfig.padding),
                        y: brickConfig.offsetY + r * (brickConfig.height + brickConfig.padding),
                        width: brickConfig.width,
                        height: brickConfig.height,
                        color: colors[r],
                        broken: false
                    });
                }
            }
        }

        function startGame() {
            if (!gameActive) {
                gameActive = true;
                gameOver = false;
                gameLoop();
            }
        }

        function resetGame() {
            gameActive = false;
            gameOver = false;
            score = 0;
            level = 1;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = 4;
            ball.dy = -4;
            paddle.x = canvas.width / 2 - 40;
            initBricks();
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            draw();
        }

        function update() {
            if (!gameActive || gameOver) return;

            // Paddle movement
            paddle.x += paddle.dx;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // Ball movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Ball wall collision
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // Ball bottom (game over)
            if (ball.y + ball.radius > canvas.height) {
                gameOver = true;
                gameActive = false;
                return;
            }

            // Ball paddle collision
            if (ball.y + ball.radius >= paddle.y &&
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                ball.y = paddle.y - ball.radius;
            }

            // Ball brick collision
            for (let brick of bricks) {
                if (!brick.broken &&
                    ball.x + ball.radius >= brick.x &&
                    ball.x - ball.radius <= brick.x + brick.width &&
                    ball.y + ball.radius >= brick.y &&
                    ball.y - ball.radius <= brick.y + brick.height) {

                    brick.broken = true;
                    score += 10 * level;
                    document.getElementById('score').textContent = score;

                    ball.dy = -ball.dy;

                    // Check if all bricks broken
                    if (bricks.every(b => b.broken)) {
                        level++;
                        document.getElementById('level').textContent = level;
                        ball.speed += 1;
                        ball.dx = ball.dx > 0 ? ball.speed : -ball.speed;
                        ball.dy = ball.dy > 0 ? ball.speed : -ball.speed;
                        initBricks();
                    }

                    break;
                }
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Paddle
            ctx.fillStyle = '#3498db';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

            // Ball
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Bricks
            for (let brick of bricks) {
                if (!brick.broken) {
                    ctx.fillStyle = brick.color;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER!', canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(gameLoop);
            }
        }

        resetGame();
    </script>
</body>
</html>
